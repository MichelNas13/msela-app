<title>Msela</title>
<style>
/* ============================================================
   MSELA · "Still Water" design system — single source of truth.
   Every colour, surface and accent below is a token. Light is the
   default; dark applies automatically with the OS AND via a manual
   [data-theme] override (the in-app toggle). No raw hex outside here.
   ============================================================ */
:root{
  /* MSELA — "Still Water" brand system (single identity, dark) */
  --navy:#ECF2EE;        /* primary text/headings (ivory) */
  --brand:#0F1A17;       /* header / hero surface */
  --brand-2:#15231E;
  --accent:#8FBFA8;      /* sage — CTAs, active, ring */
  --accent-ink:#0F1A17;  /* dark ink on sage fills */
  --btn-bg:#8FBFA8;      /* primary button fill */
  --btn-ink:#0F1A17;
  --teal:#7FB7A0; --teal-soft:#1A2A24;
  /* surfaces */
  --bg:#0F1A17; --card:#15231E; --line:#243029;
  --slate:#8FA79C; --slate2:#6E857B; --cue:#8FBFA8;
  --input:#8FBFA8;       /* focus ring */
  /* pillar / semantic tints (dimension, not performance) */
  --body:#7FB7A0; --mind:#8AA2C0; --spirit:#CBA866;
  --green:#7FB7A0; --green-chip:#1A2E24; --red:#D98A8A; --red-chip:#33201F;
  --orange:#CBA866; --orange-chip:#2E2719;
  /* ring + elevation + type */
  --ring:#8FBFA8; --ring-track:#243029; --glow:0 0 0 rgba(0,0,0,0); --on-brand-mute:#6E857B;
  --font-voice:Georgia,"Times New Roman",serif;
  --radius:18px;
  --shadow:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}
/* shared dark palette, reused by the OS query and the manual toggle */
:root[data-theme="dark"]{
  --navy:#ECF2EE; --brand:#0F1A17; --brand-2:#15231E; --accent:#8FBFA8; --accent-ink:#0F1A17;
  --btn-bg:#8FBFA8; --btn-ink:#0F1A17; --teal:#7FB7A0; --teal-soft:#1A2A24;
  --bg:#0F1A17; --card:#15231E; --line:#243029; --slate:#8FA79C; --slate2:#6E857B; --cue:#8FBFA8;
  --input:#8FBFA8; --green:#7FB7A0; --green-chip:#1A2E24; --red:#D98A8A; --red-chip:#33201F;
  --orange:#CBA866; --orange-chip:#2E2719; --ring:#8FBFA8; --ring-track:#243029;
  --body:#7FB7A0; --mind:#8AA2C0; --spirit:#CBA866;
  --glow:0 0 0 rgba(0,0,0,0); --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#ECF2EE; --brand:#0F1A17; --brand-2:#15231E; --accent:#8FBFA8; --accent-ink:#0F1A17;
    --btn-bg:#8FBFA8; --btn-ink:#0F1A17; --teal:#7FB7A0; --teal-soft:#1A2A24;
    --bg:#0F1A17; --card:#15231E; --line:#243029; --slate:#8FA79C; --slate2:#6E857B; --cue:#8FBFA8;
    --input:#8FBFA8; --green:#7FB7A0; --green-chip:#1A2E24; --red:#D98A8A; --red-chip:#33201F;
    --orange:#CBA866; --orange-chip:#2E2719; --ring:#8FBFA8; --ring-track:#243029;
    --body:#7FB7A0; --mind:#8AA2C0; --spirit:#CBA866;
    --glow:0 0 0 rgba(0,0,0,0); --shadow:0 1px 3px rgba(0,0,0,.5); color-scheme:dark;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:var(--bg); color:var(--navy); overflow-x:hidden;
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Calibri,sans-serif;
  -webkit-text-size-adjust:100%;}
header.app{position:sticky; top:0; z-index:10; background:var(--brand); color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
header.app .brandwrap{min-width:0}
header.app h1{margin:0; font-size:18px; font-weight:800; letter-spacing:1.5px}
header.app .sub{font-size:12px; color:#B9C8DA; margin-top:2px}
header.app .themebtn{flex:none; width:40px; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1}
header.app .themebtn:focus-visible{outline:3px solid var(--input); outline-offset:2px}
main{max-width:680px; margin:0 auto; padding:16px 14px calc(86px + env(safe-area-inset-bottom));}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px; margin-bottom:14px; overflow-wrap:break-word;}
.card h2{margin:0 0 4px; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--slate2); font-weight:700}
.hero{background:var(--brand); color:#fff; border:none;}
.hero h2{color:var(--on-brand-mute)} .hero .big{font-size:26px; font-weight:800; margin:4px 0; font-variant-numeric:tabular-nums}
.hero .meta{font-size:13px; color:#C9D6E5}
.chip{display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; margin:2px 6px 2px 0}
.chip.green{background:var(--green-chip); color:var(--green)}
.chip.orange{background:var(--orange-chip); color:var(--orange)}
.chip.red{background:var(--red-chip); color:var(--red)}
.chip.teal{background:var(--teal-soft); color:var(--teal)}
@media (prefers-color-scheme: dark){ .chip.teal{color:#9FD8D8} }
.exrow{display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line); min-height:48px; flex-wrap:wrap}
.exrow:last-child{border-bottom:none}
.exrow .n{flex:1; min-width:150px} .exrow .n b{display:block; font-size:15px}
.exrow .n span{font-size:12.5px; color:var(--slate)}
.exrow .rx{font-size:12.5px; color:var(--slate); white-space:nowrap}
.star{color:var(--orange); font-weight:700}
.note{font-size:13px; color:var(--slate)}
/* readable guide lists (Log progression, Measure protocol) */
.guide{margin:8px 0 2px; padding:0; list-style:none}
.guide li{position:relative; padding:0 0 0 22px; margin:0 0 12px; font-size:13.5px; line-height:1.5; color:var(--slate)}
.guide li:last-child{margin-bottom:2px}
.guide li::before{content:""; position:absolute; left:2px; top:7px; width:7px; height:7px; border-radius:50%; background:var(--accent)}
.guide li b{color:var(--navy)}
.guide.steps{counter-reset:gstep}
.guide.steps li{padding-left:30px}
.guide.steps li::before{counter-increment:gstep; content:counter(gstep); top:0; left:0; width:20px; height:20px; border-radius:50%;
  background:var(--teal-soft); color:var(--accent-ink); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center}
.guide h4{margin:14px 0 6px; font-size:12px; letter-spacing:.6px; text-transform:uppercase; color:var(--slate2)}
.cue{display:block; font-size:12px; color:var(--cue); font-weight:600; margin-top:3px}
.cue.up{color:var(--green)}
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.kpi{background:rgba(255,255,255,.10); border-radius:10px; padding:10px}
.kpi .v{font-size:20px; font-weight:700} .kpi .l{font-size:11.5px; color:#CBD8E6}
.footer-note{text-align:center; font-size:12px; color:var(--slate); margin-top:18px}
.bigscore{font-size:44px; font-weight:800; color:var(--navy); line-height:1; font-variant-numeric:tabular-nums}
/* ===== Health Excellence ring hero ===== */
.ringhero{display:flex; align-items:center; gap:18px}
.ring{--p:0; width:108px; height:108px; flex:none; border-radius:50%;
  background:conic-gradient(var(--ring) calc(var(--p)*1%), var(--ring-track) 0); box-shadow:var(--glow);
  display:flex; align-items:center; justify-content:center; transition:background .6s ease}
.ring .inner{width:84px; height:84px; border-radius:50%; background:var(--brand); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring .inner .n{font-size:32px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.ring .inner .of{font-size:10px; color:var(--on-brand-mute); letter-spacing:.5px}
.ringhero .side{min-width:0}
.ringhero .side .lab{font-size:11px; color:var(--on-brand-mute); letter-spacing:.6px; text-transform:uppercase}
.ringhero .side .st{font-size:17px; font-weight:700; color:#fff; margin-top:3px}
.ringhero .side .dl{font-size:12.5px; margin-top:4px; font-weight:600}
.gridR{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; margin-top:10px}
.dot{display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:middle}
.dot.good{background:var(--green)} .dot.meh{background:var(--orange)} .dot.bad{background:var(--red)} .dot.neutral{background:var(--teal)}
.bignum{font-size:22px; font-weight:800; color:var(--navy)} .unit{font-size:12px; color:var(--slate)}
/* forms */
.fld{margin:10px 0}
.fld label{display:block; font-size:13px; font-weight:600; margin-bottom:4px}
input[type=number],input[type=date],input[type=text],input[type=email],input[type=password],.fld select{width:100%; min-height:48px; padding:10px 12px;
  font:inherit; color:var(--navy); background:var(--card); border:1.5px solid var(--line); border-radius:10px;}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--input); outline-offset:2px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.btn{display:inline-flex; align-items:center; justify-content:center; min-height:48px; min-width:48px;
  padding:10px 18px; border:0; border-radius:12px; font:inherit; font-weight:700; cursor:pointer;
  background:var(--btn-bg); color:var(--btn-ink); width:100%; transition:filter .15s, transform .05s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--accent-ink); border:1.5px solid var(--accent); font-weight:600}
.btn.sm{min-height:44px; width:auto; padding:8px 14px; font-size:14px}
.seg{display:flex; gap:6px; margin:10px 0; flex-wrap:wrap; background:var(--bg); padding:4px; border-radius:12px; border:1px solid var(--line)}
.seg button{flex:1; min-height:40px; min-width:40px; border:0; background:transparent;
  color:var(--slate); border-radius:9px; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--navy); box-shadow:0 1px 3px rgba(15,42,71,.12)}
/* Insights lens row: keep labels at natural width and scroll if they don't fit, so 'Strength'/'Training' never cramp */
.seg.lens{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
.seg.lens::-webkit-scrollbar{display:none}
.seg.lens button{flex:1 1 auto; min-width:max-content; padding:0 14px}
/* Day picker: size buttons to their label and wrap to a second row so labels never overlap on narrow phones */
.seg.days button{flex:1 1 auto; min-width:max-content; padding:0 14px}
.setin{display:flex; gap:8px; align-items:center}
.setin{flex-wrap:wrap} .setin input{width:68px; text-align:center}
/* hide the native number spinners — they clip decimal values like 12.5 and aren't needed here */
.setin input::-webkit-outer-spin-button,.setin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setin input[type=number]{-moz-appearance:textfield}
.setin .x{color:var(--slate)}
.e1rm{font-size:12px; color:var(--slate); min-width:86px; text-align:right}
.msg{border-radius:10px; padding:10px 12px; font-size:13.5px; margin:8px 0}
.msg.err{background:var(--red-chip); color:var(--red)}
.msg.warn{background:var(--orange-chip); color:var(--orange)}
.msg.ok{background:var(--green-chip); color:var(--green)}
table.mini{width:100%; border-collapse:collapse; font-size:13.5px}
table.mini th{text-align:left; color:var(--slate); font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; padding:6px 4px; border-bottom:1px solid var(--line)}
table.mini td{padding:8px 4px; border-bottom:1px solid var(--line)}
table.mini button{min-height:36px}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.mini.nowrap th, table.mini.nowrap td{white-space:nowrap}
.toggle{display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:10px 14px;
  margin:8px 0; border:1.5px solid var(--line); border-radius:12px; background:var(--card);
  color:var(--navy); font:inherit; font-size:15px; cursor:pointer; text-align:left}
.toggle .box{width:26px; height:26px; border-radius:8px; border:2px solid var(--slate); flex:none;
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700}
.toggle[aria-pressed="true"]{border-color:var(--teal)}
.toggle[aria-pressed="true"] .box{background:var(--teal); border-color:var(--teal)}
.toggle .stk{margin-left:auto; font-size:12.5px; color:var(--slate); white-space:nowrap}
/* selectable option pills (commercial activity categories) */
.optrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.pill{min-height:42px; padding:9px 15px; border-radius:999px; border:1.5px solid var(--line); background:var(--card);
  color:var(--slate); font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; transition:background .15s,border-color .15s}
.pill[aria-pressed="true"]{background:var(--teal-soft); border-color:var(--accent); color:var(--accent-ink)}
.actcat{padding:14px 0; border-bottom:1px solid var(--line)}
.actcat:last-child{border-bottom:none; padding-bottom:2px}
.actcat .h{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.actcat .h b{font-size:15px; color:var(--navy)}
.heat{display:grid; grid-template-columns:repeat(12,1fr); gap:4px; margin-top:6px}
.heat div{aspect-ratio:1; border-radius:4px; background:var(--line)}
.heat div.on{background:var(--teal)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--navy); color:var(--bg); padding:12px 20px; border-radius:12px; font-size:14px;
  box-shadow:var(--shadow); opacity:0; transition:opacity .25s; pointer-events:none; z-index:20; max-width:88%}
.toast.show{opacity:1}
details.proto{margin:10px 0}
details.proto summary{cursor:pointer; font-size:13.5px; font-weight:600; color:var(--teal); min-height:44px; display:flex; align-items:center}
.segbar{display:inline-flex; gap:2px; background:var(--line); border-radius:10px; padding:3px; margin:2px 0 10px}
.segbar .seg{margin:0; display:inline-flex; align-items:center; justify-content:center; border:0; background:transparent; color:var(--slate); font-size:12.5px; font-weight:600; padding:6px 14px; min-height:36px; border-radius:8px; cursor:pointer}
.segbar .seg.on{background:var(--card); color:var(--navy); box-shadow:var(--shadow)}
nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:10; display:flex;
  background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(15,42,71,.05);}
nav.tabs button{flex:1 1 0; min-height:56px; min-width:0; border:0; background:none; cursor:pointer;
  font:inherit; font-size:9.5px; letter-spacing:0; color:var(--slate); display:flex; flex-direction:column;
  align-items:center; gap:3px; padding:8px 1px 7px; overflow:hidden; white-space:nowrap;}
nav.tabs button .ic{width:34px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:9px; transition:background .18s}
nav.tabs button .ic svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink); font-weight:700}
nav.tabs button[aria-selected="true"] .ic{background:var(--teal-soft)}
nav.tabs button:focus-visible{outline:3px solid var(--input); outline-offset:-3px; border-radius:10px}
.screen{display:none} .screen.active{display:block}
/* welcome / sign-in cover */
.cover{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  padding:28px calc(20px + env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-right));
  background:radial-gradient(130% 80% at 50% 0%, #15231E 0%, #0F1A17 62%);
  overflow-y:auto;}
.cover-inner{width:100%; max-width:384px; margin:auto}
.cover-brand{text-align:center; color:#fff; margin-bottom:24px}
.cover-logo{width:88px; height:88px; border-radius:24px; box-shadow:0 10px 34px rgba(0,0,0,.40); margin-bottom:16px}
.cover-name{font-family:var(--font-voice); font-size:30px; font-weight:500; letter-spacing:.3px; line-height:1; margin:0; color:var(--navy)}
.cover-name::after{content:""; display:block; width:44px; height:2px; background:var(--spirit); border-radius:2px; margin:14px auto 0}
.cover-tag{font-size:14px; color:#AEBFB6; margin-top:16px; font-weight:600; letter-spacing:.3px}
.cover-sub{font-size:13px; color:var(--on-brand-mute); margin-top:3px}
.cover-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px 18px; box-shadow:0 20px 56px rgba(0,0,0,.34)}
.cover-card h2{margin:0 0 3px; font-size:17px; font-weight:700; color:var(--navy); letter-spacing:0; text-transform:none}
.cover-card .cover-note{font-size:13px; color:var(--slate); margin-bottom:4px}
.cover-btn{margin-top:10px}
.cover-skip{display:block; width:100%; margin-top:16px; background:none; border:0; color:var(--slate);
  font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; min-height:40px}
.cover-foot{text-align:center; color:var(--slate2); font-size:11.5px; margin-top:18px}

/* ===== MSELA 2.0 design system — type gears, pillar accents, M·Score ring ===== */
.t-hero{font-family:var(--font-voice);font-size:44px;color:var(--navy);line-height:1}
.t-primary{font-size:18px;color:var(--navy)}
.t-label{font-size:10px;color:var(--slate);letter-spacing:.15em;text-transform:uppercase}
.t-support{font-size:12.5px;color:var(--slate)}
.c-spirit{color:var(--spirit)} .c-body{color:var(--body)} .c-mind{color:var(--mind)}
.mring{width:146px;height:146px;display:block;margin:0 auto}
.mring-n{fill:var(--navy);font-family:var(--font-voice);font-size:44px}
.mring-l{fill:var(--slate);font-size:9.5px;letter-spacing:1px}
.greet{font-size:14px;color:#AEBFB6}
.todayrow{display:flex;align-items:center;gap:12px}
.todayrow .ic{font-size:18px;width:20px;text-align:center}
.todayrow .nm{flex:1;font-size:14.5px;color:var(--navy)}
.todayrow .sub{font-size:12px;color:var(--slate);margin-top:1px}
.todayrow .st{font-size:12.5px;color:var(--slate)}
.todayrow .act{font-size:12.5px;color:var(--accent);cursor:pointer}
.tbar{height:3px;background:var(--ring-track);border-radius:2px;margin-top:5px}
.tbar > div{height:3px;background:var(--body);border-radius:2px}
.sig{display:flex;justify-content:space-between;text-align:center}
.sig > div .l{font-size:10px;letter-spacing:.08em}
.sig > div .v{font-size:21px;color:var(--navy);font-family:var(--font-voice);margin-top:2px}
.subnav{display:flex;gap:6px;padding:8px 16px 2px;overflow-x:auto;scrollbar-width:none}

/* ============ CALCS (ported from workbook, verified) ============ */
const Calc = {
  bri(waistCm, heightM) {
    const x = ((waistCm / 100) / (2 * Math.PI)) ** 2 / (0.5 * heightM) ** 2;
    return 364.2 - 365.5 * Math.sqrt(Math.max(0, 1 - x));
  },
  whtr: (waistCm, heightM) => waistCm / (heightM * 100),
  whr:  (waistCm, hipCm) => waistCm / hipCm,

  briZone(b) { return BRI_MODEL.zone(b); }   // single source of truth (M12)

/* ============ BRI MODEL — ONE source of truth for the gauge, the zones and the score (M12) ============ */
// Body Roundness Index is a descriptive trend, not a diagnosis. The score is U-shaped: it peaks in the
// evidence low-risk band and declines on BOTH sides, reflecting the 2024 JAMA cohort (Nat. all-cause
// mortality was U-shaped — the lowest BRI group also carried elevated risk). It is goal-aware, so a
// deliberately lean personal target is never penalised.
const BRI_MODEL = {
  healthyLow: 4.5, healthyHigh: 5.5,                 // low-risk band (approx. middle-quintile nadir)
  bounds: [2.5, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5],       // gauge arc boundaries
  gaugeColors: ["var(--orange)", "var(--teal)", "var(--green)", "var(--orange)", "var(--orange)", "var(--red)"],
  bands: [
    { lt: 3.5, label: "Very Lean", cls: "orange" },  // below the nadir — U-shape caution (context-dependent)
    { lt: 4.5, label: "Lean",      cls: "teal"   },
    { lt: 5.5, label: "Healthy",   cls: "green"  },   // low-risk band
    { lt: 6.5, label: "Watch",     cls: "orange" },
    { lt: 7.5, label: "Elevated",  cls: "orange" },
    { lt: Infinity, label: "High", cls: "red"    },
  ],
  zone(b) { for (const z of this.bands) if (b < z.lt) return { label: z.label, cls: z.cls }; return { label: "High", cls: "red" }; },
  score(bri, targetBri) {
    if (bri == null) return null;
    const lo = Math.min(this.healthyLow, (targetBri && targetBri > 0) ? targetBri : this.healthyLow), hi = this.healthyHigh;
    let s = (bri >= lo && bri <= hi) ? 100 : (bri > hi) ? 100 - (bri - hi) * 16 : 100 - (lo - bri) * 12;

function isMinorProfile(profile, now) { const by = profile && profile.birthYear; return !!(by && ((now ? now.getFullYear() : new Date().getFullYear()) - by) < 18); }

  workouts:     r => r.date + "|" + r.sessionKey + "|" + (r.cluster != null ? r.cluster : ""),

    // Try the main key, then the mirror, then a clean default — so one bad write can never wipe the history.
    for (const key of [STORE_KEY, MIRROR_KEY]) {
      try { const o = this.parseValid(localStorage.getItem(key)); if (o) return mergeSaved(o); } catch (e) {}
    }
    return mergeSaved({});   // clean install still runs migrations (seeds starting Scripture state)
  },
  save(d, keepStamp) {
    if (!keepStamp) d.updatedAt = new Date().toISOString();   // stamp for cloud-merge conflict resolution (skip on boot-time normalisation)
    let json; try { json = JSON.stringify(d); } catch (e) { try { App._lastSaveOK = false; } catch (_) {} if (typeof toast === "function") toast("⚠ Couldn't prepare your data to save."); return; }
    try {
      const prev = localStorage.getItem(STORE_KEY);
      // keep the last good main copy in the mirror BEFORE overwriting the main key
      if (prev) { try { if (this.parseValid(prev)) localStorage.setItem(MIRROR_KEY, prev); } catch (e) {} }
      localStorage.setItem(STORE_KEY, json);
      const landed = localStorage.getItem(STORE_KEY) === json;   // read-back: did the write actually persist?
      try { App._lastSaveAt = new Date(); App._lastSaveOK = landed; } catch (_) {}
      if (!landed && typeof toast === "function") toast("⚠ The save didn't stick — this device may be clearing app storage. Export a backup from Data.");
    } catch (e) {
      // S1-11: storage full / write blocked — never fail silently. The previous good copy is untouched.
      try { App._lastSaveOK = false; } catch (_) {}
      if (typeof toast === "function") toast("⚠ Couldn't save on this device — storage may be full or blocked. Export a backup from Data to be safe.");
    }
    if (typeof FileSync !== "undefined" && FileSync.handle) FileSync.write(d); // mirror to linked file if any
  },
  // Ask the browser to make this app's storage durable (not auto-evicted). Installed apps are usually granted it.
  requestPersist() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        const done = (g) => { try { App._persist = g ? 'granted' : 'denied'; if (App.renderData) App.renderData(); } catch (e) {} };
        if (navigator.storage.persisted) navigator.storage.persisted().then(a => { if (a) done(true); else navigator.storage.persist().then(done); });
        else navigator.storage.persist().then(done);
      } else { App._persist = 'unsupported'; }
    } catch (e) { App._persist = 'error'; }
  }

/* ============ PROGRAM CLOCK & DATES ============ */
const Clock = {
  parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); },
  toISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); },
  week(data, date) {
    const days = Math.floor((date - this.parseISO(data.program.startDate)) / 86400000);
    return days < 0 ? 0 : Math.floor(days / 7) + 1;
  },
  block(data, wk) { return data.program.blocks.find(b => wk >= b.weeks[0] && wk <= b.weeks[1]) || null; },
  isDeload: (data, wk) => data.program.deloadWeeks.includes(wk),
  isoWeekKey(dt) {
    const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
    const day = (d.getUTCDay() + 6) % 7;
    d.setUTCDate(d.getUTCDate() - day + 3);
    const wk1 = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
    const wd1 = (wk1.getUTCDay() + 6) % 7;
    wk1.setUTCDate(wk1.getUTCDate() - wd1 + 3);
    const week = 1 + Math.round((d - wk1) / (7 * 86400000));
    return d.getUTCFullYear() + "-W" + String(week).padStart(2, "0");
  },
  weekKeysBack(now, n) {
    const out = []; const d = new Date(now);
    for (let i = 0; i < n; i++) { out.unshift(this.isoWeekKey(d)); d.setDate(d.getDate() - 7); }
    return out;
  }
};

/* ============ DOMAIN LOGIC ============ */
const Logic = {
  tentpoleHistory(data, tentKey) {
    const hist = [];
    for (const w of data.workouts) for (const s of (w.sets || []))
      if (s.tent === tentKey && isFinite(s.kg) && isFinite(s.reps) && s.reps > 0 && s.reps <= 12)   // M26: e1RM only where it's valid (≤12 reps)
        hist.push({ date: w.date, e1rm: Calc.e1rm(s.kg, s.reps) });
    hist.sort((a, b) => a.date < b.date ? -1 : 1);
    return hist;
  },
  // M26: require a SUSTAINED drop (>2.5%) before calling a stall — a 0.1% dip is noise, not a plateau.
  stallStatus(hist) {
    if (hist.length < 3) return { code: "building", label: "building data", cls: "teal" };
    const latest = hist[hist.length - 1].e1rm, ref = hist[hist.length - 3].e1rm;
    const change = ref ? (latest - ref) / ref : 0;
    if (change > 0.001) return { code: "progress", label: "PROGRESSING", cls: "green" };
    if (change < -0.025) return { code: "stall", label: "STALLED — check recovery", cls: "red" };
    return { code: "hold", label: "HOLDING", cls: "orange" };
  },
  lastTime(data, sessionKey, slotName) {
    for (let i = data.workouts.length - 1; i >= 0; i--) {
      const w = data.workouts[i];
      if (w.sessionKey !== sessionKey) continue;
      const s = (w.sets || []).find(x => x.slot === slotName);
      if (s) return s.kg + " kg × " + s.reps + " (" + w.date + ")";
    }
    return null;
  },
  validateMeasure(v, last) {
    const errors = [], warnings = [];
    const rng = (val, lo, hi, name) => { if (val != null && (val < lo || val > hi)) errors.push(name + " looks implausible (" + val + ")"); };
    if (!v.date) errors.push("Date is required");
    if (v.weightKg == null && v.waistCm == null) errors.push("Enter at least weight or waist");
    rng(v.weightKg, 30, 300, "Weight"); rng(v.waistCm, 40, 250, "Waist");
    rng(v.navelCm, 40, 250, "Navel"); rng(v.hipCm, 40, 250, "Hip");
    rng(v.sleepH, 0, 14, "Sleep"); rng(v.rhr, 30, 120, "Resting HR");
    rng(v.bpSys, 70, 220, "BP systolic"); rng(v.bpDia, 40, 140, "BP diastolic");
    rng(v.bodyFatPct, 3, 60, "Body fat %");
    rng(v.sleepScore, 0, 100, "Sleep score");
    if (v.navelCm != null && v.waistCm != null && v.navelCm < v.waistCm - 15) warnings.push("Navel < waist by >15cm — check landmarks");
    if (last) {
      if (v.weightKg != null && last.weightKg != null && Math.abs(v.weightKg - last.weightKg) > 2.5)
        warnings.push("Weight moved " + (v.weightKg - last.weightKg).toFixed(1) + " kg since last reading — fluid noise? (sodium, sleep, bowels)");
      if (v.waistCm != null && last.waistCm != null && Math.abs(v.waistCm - last.waistCm) > 3)
        warnings.push("Waist moved " + (v.waistCm - last.waistCm).toFixed(1) + " cm — re-measure to confirm landmark");
    }
    return { errors, warnings };
  },
};

const Prog = {
  range(rx) {
    const tail = String(rx).split("×").pop();
    if (/\d\s*-?\s*\d*\s*s\b|sec/.test(tail)) return { kind: "time" };
    const r = tail.match(/(\d+)\s*-\s*(\d+)/);
    if (r) return { kind: "reps", lo: +r[1], hi: +r[2] };
    const one = tail.match(/(\d+)/);
    return one ? { kind: "reps", lo: +one[1], hi: +one[1] } : { kind: "reps", lo: 8, hi: 12 };
  },
  loadable(slot, ex) {
    if (slot.tent) return true;
    const n = (ex || slot.name).toLowerCase();
    return !/plank|hollow|dead bug|copenhagen|l-sit|hanging|crunch|sit-up|mountain|med ball/.test(n);
  },
  inc(slot, ex) {
    const n = ((ex || "") + " " + slot.name).toLowerCase();
    return /curl|raise|fly|extension|pushdown|pec deck|face pull|rear|lateral|oblique|side bend|forearm|isolation/.test(n) ? 1 : 2.5;
  },
  // M08: progression keys on the EXACT exercise, never the rotating slot — so a load is never carried
  // from one movement to a different one when the variation changes.
  lastSet(data, sessionKey, exercise) {
    for (let i = data.workouts.length - 1; i >= 0; i--) {
      const w = data.workouts[i];
      if (w.sessionKey !== sessionKey) continue;
      const s = (w.sets || []).find(x => x.exercise === exercise && isFinite(x.kg) && isFinite(x.reps));
      if (s) return { kg: s.kg, reps: s.reps, rir: (s.rir != null ? s.rir : null), date: w.date };
    }
    return null;
  },
  suggest(data, sessionKey, slot, ex) {
    const R = this.range(slot.rx);
    if (R.kind === "time" || !this.loadable(slot, ex))
      return { mode: "bw", kg: null, reps: R.hi || null, text: "Bodyweight / core — add reps or hold time; add load only once it feels easy." };
    const last = this.lastSet(data, sessionKey, ex), inc = this.inc(slot, ex);   // M08: match by exact exercise
    if (!last) {
      const seed = SEED_WEIGHTS[slot.name];
      return { mode: "calibrate", kg: seed ?? null, reps: R.hi,
        text: "Cluster 1 — find your working weight: ~" + R.hi + " clean reps with 2 left in the tank" + (seed ? " (≈ " + seed + "kg to start)" : "") + ". Groove the form now; load climbs as clusters build." };
    }
    if (last.rir != null && last.rir >= 3) {   // M29: an easy set (3+ reps in reserve) should progress, even mid-range
      const w = Math.round((last.kg + inc) * 2) / 2;
      return { mode: "up", kg: w, reps: R.lo, text: "You left " + last.rir + " reps in the tank last time — add load: try " + w + "kg × " + R.lo + "+." };
    }
    if (last.reps >= R.hi) {
      const w = Math.round((last.kg + inc) * 2) / 2;
      return { mode: "up", kg: w, reps: R.lo, text: "Add weight — try " + w + "kg × " + R.lo + "+ (you hit " + R.hi + " at " + last.kg + "kg last time)." };
    }
    return { mode: "hold", kg: last.kg, reps: R.hi,
      text: last.kg + "kg — aim for " + R.hi + " reps (last " + last.reps + "); clear " + R.hi + " on every set, then +" + inc + "kg." };
  }
};

    const testimony = (() => { const ts = s.testimonies || []; if (!ts.length) return null; const firstW = weekMonISO(ts.map(t => t.date).sort()[0]); const curW = weekMonISO(todayISO); if (win <= 7) { if (curW < firstW) return null; const sun = toISO(new Date(parse(curW).getTime() + 6 * 86400000)); return ts.some(t => t.date >= curW && t.date <= sun) ? 100 : null; } let sum = 0, cnt = 0; for (let wm = parse(weekMonISO(days[0])); toISO(wm) <= curW; wm.setDate(wm.getDate() + 7)) { const wmISO = toISO(wm); if (wmISO < firstW) continue; const sun = toISO(new Date(wm.getTime() + 6 * 86400000)); const has = ts.some(t => t.date >= wmISO && t.date <= sun); const isCur = wmISO === curW; if (has) { sum += 100; cnt++; } else if (!isCur) { sum += 0; cnt++; } } return cnt ? Math.round(sum / cnt) : null; })();
    const W = { journey: 30, prayer: 30, bsf: 20, testimony: 20 };
    const dims = { journey: journey, prayer: prayer, bsf: bsf, testimony: testimony };
    let num = 0, den = 0; for (const k in dims) { if (dims[k] != null) { num += W[k] * dims[k]; den += W[k]; } }
    const spirit = den ? Math.round(num / den) : null;

  },
  mindBreakdown(data, now, win) {

    const readLog = m.readLog || {}, items = m.items || [];
    const learned = iso => ((readLog[iso] || []).length > 0) || items.some(i => i.date === iso);

  },  // M19: resting-HR scored against evidence bands (not an ad-hoc curve). Very low is NOT auto-rewarded to 100

  rhr(v) {
    if (v == null) return null;

  rhrFlag(v) { return v == null ? "" : v < 40 ? "very low — worth confirming with a clinician" : v >= 90 ? "elevated — recheck rested; review if it persists" : ""; },
  sleep(score, hrs) {

/* ============ TRACK (period-based progress) ============ */
const Track = {
  fval(m, f, h) { return f === "bri" ? (m.waistCm != null ? Calc.bri(m.waistCm, h) : null) : (m[f] != null ? m[f] : null); },
  series(ms, f, h) { return ms.map(m => ({ d: Clock.parseISO(m.date), v: this.fval(m, f, h), date: m.date })).filter(p => p.v != null); },
  delta(ms, f, h, start) {
    const s = this.series(ms, f, h); if (!s.length) return null;
    const latest = s[s.length - 1]; let base = null;
    for (const p of s) if (p.d <= start) base = p;            // your value entering the period
    if (!base) base = s.find(p => p.d >= start) || null;       // else first reading within it
    if (!base || base.date === latest.date) return { latest, base: base || latest, change: null };
    return { latest, base, change: latest.v - base.v };
  }
};

/* ============ INSIGHTS (deeper analytics — pure, testable) ============ */
const Insights = {
  // ETA to a target at the recent pace (last ~90 days, fallback last 4 readings)
  projection(ms, f, h, targetV, now) {
    const s = Track.series(ms, f, h);
    if (targetV == null) return null;
    if (s.length < 4) return { insufficient: true, n: s.length };              // M22: need ≥4 readings
    const latest = s[s.length - 1];
    const cut = new Date(latest.d.getTime() - 90 * 86400000);
    let win = s.filter(p => p.d >= cut);
    if (win.length < 4) win = s.slice(-Math.min(6, s.length));
    const a = win[0], b = win[win.length - 1], days = (b.d - a.d) / 86400000;
    if (days < 21) return { insufficient: true, n: s.length };                 // M22: need ≥~3 weeks span
    const perMonth = (b.v - a.v) / days * 30.44, gap = targetV - latest.v;
    if (Math.abs(gap) < 1e-6) return { reached: true, latest, perMonth };
    const movingToward = (gap < 0 && perMonth < 0) || (gap > 0 && perMonth > 0);
    if (!movingToward || Math.abs(perMonth) < 1e-3) return { stalled: true, latest, perMonth, gap };
    const months = gap / perMonth, mk = f => new Date(latest.d.getTime() + months * f * 30.44 * 86400000);
    // present a RANGE, not a false-precise single ETA (M22)
    return { latest, perMonth, gap, months, eta: mk(1), etaLo: mk(0.7), etaHi: mk(1.5), estimate: true };
  },
  tonnage(workouts, since) {
    let kg = 0, sets = 0;
    workouts.forEach(w => {
      if (since && Clock.parseISO(w.date) < since) return;
      (w.sets || []).forEach(s => {
        const r = isFinite(s.reps) ? s.reps : 0, k = isFinite(s.kg) ? s.kg : 0, sc = isFinite(s.setCount) ? s.setCount : 1;
        if (k > 0 && r > 0) { kg += sc * r * k; sets += sc; }
      });
    });
    return { kg: Math.round(kg), sets };
  },
  weeklyCount(activities, type, now, nWeeks) {
    const out = [], d = new Date(now);
    for (let i = 0; i < nWeeks; i++) {
      const k = Clock.isoWeekKey(d);
      out.unshift({ week: k, n: (activities || []).filter(a => a.type === type && Clock.isoWeekKey(Clock.parseISO(a.date)) === k).length });
      d.setDate(d.getDate() - 7);
    }
    return out;
  },
  streak(activities, type, now) {
    let d = new Date(now), s = 0;
    const has = wk => (activities || []).some(a => a.type === type && Clock.isoWeekKey(Clock.parseISO(a.date)) === wk);
    if (!has(Clock.isoWeekKey(d))) d.setDate(d.getDate() - 7);
    for (let i = 0; i < 260; i++) { if (has(Clock.isoWeekKey(d))) { s++; d.setDate(d.getDate() - 7); } else break; }
    return s;
  },
  sessionsInWindow(workouts, now, days) {
    const cut = new Date(now.getTime() - days * 86400000);
    return (workouts || []).filter(w => Clock.parseISO(w.date) >= cut).length;
  },
};

/* M·Score ring — three arcs (Spirit/Body/Mind), each filled to its pillar score; headline = average of present pillars */
const MSCORE_W = { spirit: 45, body: 35, mind: 20 };
function mscoreRing(sp, bd, md) {
  const cx = 75, cy = 75, r = 60, span = 96;
  const P = a => { const t = a * Math.PI / 180; return [(cx + r * Math.sin(t)).toFixed(2), (cy - r * Math.cos(t)).toFixed(2)]; };
  const arc = (a0, a1) => { const [sx, sy] = P(a0), [ex, ey] = P(a1), large = Math.abs(a1 - a0) > 180 ? 1 : 0; return "M" + sx + "," + sy + " A" + r + "," + r + " 0 " + large + " 1 " + ex + "," + ey; };
  const seg = (center, pct, varName) => {
    const start = center - span / 2, end = center + span / 2;
    let out = '<path d="' + arc(start, end) + '" fill="none" stroke="var(--ring-track)" stroke-width="7.5" stroke-linecap="round"/>';
    if (pct != null) { const fe = start + span * (Math.max(0, Math.min(100, pct)) / 100); out += '<path d="' + arc(start, fe) + '" fill="none" stroke="var(' + varName + ')" stroke-width="7.5" stroke-linecap="round"/>'; }
    return out;
  };
  const vals = [sp, bd, md].filter(v => v != null);
  const msp = [["spirit", sp], ["body", bd], ["mind", md]].filter(x => x[1] != null);
  let wnum = 0, wden = 0; msp.forEach(x => { wnum += MSCORE_W[x[0]] * x[1]; wden += MSCORE_W[x[0]]; });
  const head = msp.length >= 2 ? Math.round(wnum / wden) : null;
  return '<svg viewBox="0 0 150 150" class="mring" aria-hidden="true">' +
    seg(0, sp, "--spirit") + seg(120, bd, "--body") + seg(240, md, "--mind") +
    '<text x="75" y="80" text-anchor="middle" class="mring-n">' + (head == null ? "&#8212;" : head) + '</text>' +
    '<text x="75" y="97" text-anchor="middle" class="mring-l">M·SCORE</text></svg>';
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove("show"), 2400);
}
function numVal(id) {
  const el = document.getElementById(id);
  if (!el || el.value === "") return null;
  const n = Number(el.value); return isFinite(n) ? n : null;
}

  setLogSession(k) { this.logSession = k; this.renderLog(); },
  // current cluster for a day-type = how many of that day's sessions you've logged, + 1 (completion-based)
  epoch() { return (this.data.programState && this.data.programState.programEpoch) || ""; },   // C4: cluster counter starts here; load history (Prog.lastSet) stays unfiltered
  dayDone(key) {

  },
  // M27: the deload gate now uses the SAME block lengths as the documented periodisation (the 6-week
  // programme blocks), so the gate and the phase labels never disagree. Past week 52, 6-cluster maintenance blocks.
  blockEnd() {

  exFor(slot, cl) { return slot.w[(cl - 1) % slot.w.length]; },   // loops the rotation past cluster 52
  phaseFor(cl) {

  coreDays() { return (this.data.program.coreDays || ["pushA", "pushB", "pullB"]); },
  clusterOf(key) { return Math.min(this.dayDone(key) + 1, this.blockEnd()); },
  isBlocked(key) { return this.coreDays().includes(key) && this.dayDone(key) >= this.blockEnd(); },  // Wed/Fri catch-up days are never gated

  const counts = { book: m.books.length, summary: 0, article: 0, paper: 0, lecture: 0, podcast: 0, other: 0 };
  m.items.forEach(i => { counts[i.type] = (counts[i.type] || 0) + 1; });
  const order = [['book', 'Books'], ['summary', 'Summaries'], ['article', 'Articles'], ['paper', 'Papers'], ['lecture', 'Lectures'], ['podcast', 'Podcasts'], ['other', 'Other']];
  const shown = order.filter(o => counts[o[0]]);
  html += '<div class="card"><div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:space-around">' + (shown.length ? shown.map(o => '<div style="text-align:center;min-width:56px"><div style="font-family:var(--font-voice);font-size:20px;color:var(--navy)">' + counts[o[0]] + '</div><div class="t-support">' + o[1] + '</div></div>').join('') : '<div class="t-support">Nothing logged yet.</div>') + '</div></div>';

  html += label('INSIGHTS');
  const rated = m.items.filter(i => i.useful != null).concat(m.books.filter(b => b.useful != null));
  const totalLogged = m.items.length + m.books.length;
  html += '<div class="card">';
  if (totalLogged < 12 || rated.length < 8) {
    html += '<div class="t-support">Your patterns will emerge as your Learning Library grows.</div>';
  } else {
    const pct = Math.round(rated.filter(r => r.useful === true).length / rated.length * 100);
    html += '<div style="text-align:center"><div style="font-family:var(--font-voice);font-size:32px;color:var(--mind)">' + pct + '%</div><div class="t-support">rated useful · ' + rated.length + ' rated</div></div>';
    const byType = {}; m.items.forEach(i => { if (i.useful != null) { (byType[i.type] = byType[i.type] || []).push(i.useful); } });
    const bu = m.books.filter(b => b.useful != null).map(b => b.useful); if (bu.length) byType.book = bu;
    const lines = []; order.forEach(o => { const arr = byType[o[0]]; if (arr && arr.length >= 5) { lines.push(o[1] + ' ' + Math.round(arr.filter(Boolean).length / arr.length * 100) + '% useful'); } });
    if (lines.length) html += '<div class="t-support" style="margin-top:12px;line-height:1.8">' + lines.join('<br>') + '</div>';
    const fin = m.books.filter(b => b.status === 'finished').length, ab = m.books.filter(b => b.status === 'abandoned').length;
    if (fin + ab >= 3) html += '<div class="t-support" style="margin-top:10px">' + fin + ' finished · ' + ab + ' abandoned</div>';
  }
  html += '</div>';
  el.innerHTML = html;
};

    let rec = s.journeyRead[iso]; if (rec === true) rec = { ot: true, nt: true }; rec = rec || { ot: false, nt: false };
    const t = (track === 'nt') ? 'nt' : 'ot';
    if (rec[t]) { rec[t] = false; } else { rec[t] = true; this._addReading(s, t === 'ot' ? e.r : e.nt, t === 'nt'); }

  } else {

/* ============ DASHBOARD GRAPHICS (hand-rolled SVG, zero deps) ============ */
const Dash = {
  zoneColors: BRI_MODEL.gaugeColors,   // single source of truth (M12)
  zoneBounds: BRI_MODEL.bounds,
  angle(v) { const c = Math.min(Math.max(v, 2.5), 8.5); return 180 * (1 - (c - 2.5) / 6); },
  pt(cx, cy, r, deg) { const a = deg * Math.PI / 180; return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; },
  arc(cx, cy, r, d1, d2) {
    const [x1, y1] = this.pt(cx, cy, r, d1), [x2, y2] = this.pt(cx, cy, r, d2);
    return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  },
  progressPct(start, target, cur) {
    if (start === target || cur == null) return 0;
    return Math.max(0, Math.min(1, (start - cur) / (start - target)));
  },
  gauge(briW, briN, target) {
    const cx = 150, cy = 150, r = 110;
    let s = `<svg viewBox="0 0 300 175" style="width:100%;max-width:250px;height:auto;display:block;margin:0 auto" role="img" aria-label="BRI gauge: waist ${briW != null ? briW.toFixed(2) : "no data"}, navel ${briN != null ? briN.toFixed(2) : "no data"}, target ${target}">`;
    for (let i = 0; i < 6; i++) {
      const d1 = this.angle(this.zoneBounds[i]), d2 = this.angle(this.zoneBounds[i + 1]);
      s += `<path d="${this.arc(cx, cy, r, d1, d2)}" stroke="${this.zoneColors[i]}" stroke-width="20" fill="none" opacity="${i % 2 ? 0.55 : 0.95}" stroke-linecap="butt"/>`;
    }
    for (let i = 1; i < 6; i++) {  /* boundary labels */
      const [x, y] = this.pt(cx, cy, r + 22, this.angle(this.zoneBounds[i]));
      s += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="9.5" fill="var(--slate)" text-anchor="middle">${this.zoneBounds[i]}</text>`;
    }
    if (target != null) {  /* target notch */
      const [x1, y1] = this.pt(cx, cy, r - 14, this.angle(target)), [x2, y2] = this.pt(cx, cy, r - 26, this.angle(target));
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--navy)" stroke-width="2.5"/>
            <text x="${x2.toFixed(1)}" y="${(y2 + 12).toFixed(1)}" font-size="9" fill="var(--slate)" text-anchor="middle">target</text>`;
    }
    if (briN != null) {  /* navel marker: outer triangle */
      const d = this.angle(briN);
      const [tx, ty] = this.pt(cx, cy, r + 14, d);
      s += `<path d="M ${tx.toFixed(1)} ${ty.toFixed(1)} l -5 -9 l 10 0 Z" fill="var(--orange)" transform="rotate(${(90 - d).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})"/>`;
    }
    if (briW != null) {  /* needle */
      const d = this.angle(briW);
      const [nx, ny] = this.pt(cx, cy, r - 32, d);
      s += `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--navy)" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="${cx}" cy="${cy}" r="6" fill="var(--navy)"/>
            <text x="${cx}" y="${cy - 38}" font-size="30" font-weight="700" fill="var(--navy)" text-anchor="middle">${briW.toFixed(2)}</text>
            <text x="${cx}" y="${cy - 20}" font-size="10.5" fill="var(--slate)" text-anchor="middle">BRI (waist)</text>`;
    } else {
      s += `<text x="${cx}" y="${cy - 30}" font-size="13" fill="var(--slate)" text-anchor="middle">add a measurement</text>`;
    }
    return s + `</svg>`;
  },
  ring(pct, big, label, sub) {
    const noData = pct == null;                 // null → genuinely no data; show "—" not a misleading 0%
    const p = noData ? 0 : pct;
    const r = 44, C = 2 * Math.PI * r, on = (p * C).toFixed(1);
    return `<svg viewBox="0 0 120 132" style="width:100%;max-width:92px;height:auto;display:block;margin:0 auto" role="img" aria-label="${esc(label)}: ${noData ? "no data" : Math.round(p * 100) + "% to target"}">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--teal)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${on} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>
      <text x="60" y="56" font-size="20" font-weight="700" fill="var(--navy)" text-anchor="middle">${noData ? "—" : Math.round(p * 100) + "%"}</text>
      <text x="60" y="72" font-size="10" fill="var(--slate)" text-anchor="middle">${esc(big)}</text>
      <text x="60" y="124" font-size="11" font-weight="600" fill="var(--navy)" text-anchor="middle">${esc(label)}</text>
      <text x="60" y="88" font-size="9.5" fill="var(--slate)" text-anchor="middle">${esc(sub)}</text></svg>`;
  },
  spark(series, color, W, H) {
    if (!series.length) return "";
    const xs = series.map(p => p.x), ys = series.map(p => p.y);
    let xmin = Math.min(...xs), xmax = Math.max(...xs); if (xmin === xmax) { xmin -= 1; xmax += 1; }
    let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo || 1) * 0.25; lo -= pad; hi += pad;
    const fx = x => 7 + (x - xmin) / (xmax - xmin) * (W - 14);
    const fy = v => H - 7 - (v - lo) / (hi - lo) * (H - 14);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="trend" style="width:100%;height:auto;margin-top:8px">`;
    s += `<line x1="7" y1="${(H - 7).toFixed(1)}" x2="${W - 7}" y2="${(H - 7).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    if (series.length > 1) s += `<polyline points="${series.map(p => fx(p.x).toFixed(1) + "," + fy(p.y).toFixed(1)).join(" ")}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    series.forEach((p, i) => { s += `<circle cx="${fx(p.x).toFixed(1)}" cy="${fy(p.y).toFixed(1)}" r="${i === series.length - 1 ? 3.4 : 2}" fill="${color}"/>`; });
    return s + `</svg>`;
  },
  bar(pct, color) {
    pct = Math.max(0, Math.min(1, pct));
    return `<svg viewBox="0 0 100 8" preserveAspectRatio="none" role="img" aria-label="${Math.round(pct * 100)} percent to target" style="width:100%;height:8px;display:block"><rect width="100" height="8" rx="4" fill="var(--line)"/><rect width="${(pct * 100).toFixed(1)}" height="8" rx="4" fill="${color}"/></svg>`;
  },
  /* Reusable trend chart (M47/M24/M41): single shared scale by default (dual only when
     axes are genuinely different units), hover tooltips via native <title>, per-series
     units, a readable y-axis, and an accessible data-table fallback. */
  chart(series, opts = {}) {
    const W = 600, H = 184, pl = 44, pr = 44, pt_ = 20, pb = 28;
    // optional period window (M24): keep only points newer than `opts.days` before the latest reading
    if (opts.days) {
      const latest = Math.max(...series.flatMap(s => s.points.map(p => p.x)).concat([0]));
      const cut = latest - opts.days * 86400000;
      series = series.map(s => ({ ...s, points: s.points.filter(p => p.x >= cut) }));
    }
    const allX = series.flatMap(s => s.points.map(p => p.x));
    if (!allX.length) return `<div class="note" style="text-align:center;padding:14px 8px">No readings in this window.</div>`;
    let xmin = Math.min(...allX), xmax = Math.max(...allX);
    if (xmin === xmax) { xmin -= 3 * 86400000; xmax += 3 * 86400000; }
    const fx = x => pl + (x - xmin) / (xmax - xmin) * (W - pl - pr);
    const scaled = series.map((s) => {
      let ys = s.points.map(p => p.y);
      if (s.band) ys = ys.concat(s.points.map(p => p.y + s.band), s.points.map(p => p.y - s.band));
      let lo, hi;
      if (opts.dual) { lo = Math.min(...ys); hi = Math.max(...ys); }
      else { const ally = series.flatMap(z => z.points.map(p => p.y)); lo = Math.min(...ally); hi = Math.max(...ally); }
      const pad = (hi - lo || 1) * 0.18; lo -= pad; hi += pad;
      const fy = y => H - pb - (y - lo) / (hi - lo) * (H - pt_ - pb);
      return { ...s, fy, lo, hi };
    });
    const dfmt = ms => { const d = new Date(ms); return d.getDate() + "/" + (d.getMonth() + 1); };
    const uOf = sr => sr.unit != null ? sr.unit : (opts.unit || "");
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "trend chart")}">`;
    // shared y-axis grid + labels (only meaningful when a single scale is shared)
    if (!opts.dual) {
      const g = scaled[0]; const mid = (g.lo + g.hi) / 2;
      [g.hi, mid, g.lo].forEach(v => {
        const y = g.fy(v);
        s += `<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W - pr}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity="0.5"/>
              <text x="${pl - 6}" y="${(y + 3).toFixed(1)}" font-size="10" fill="var(--slate)" text-anchor="end">${(Math.round(v * 10) / 10)}</text>`;
      });
    }
    s += `<line x1="${pl}" y1="${H - pb}" x2="${W - pr}" y2="${H - pb}" stroke="var(--line)" stroke-width="1.2"/>`;
    s += `<text x="${pl}" y="${H - 8}" font-size="10" fill="var(--slate)">${dfmt(xmin)}</text>
          <text x="${W - pr}" y="${H - 8}" font-size="10" fill="var(--slate)" text-anchor="end">${dfmt(xmax)}</text>`;
    scaled.forEach((sr, si) => {
      const u = uOf(sr);
      const pts = sr.points.map(p => fx(p.x).toFixed(1) + "," + sr.fy(p.y).toFixed(1)).join(" ");
      if (sr.band) {
        const up = sr.points.map(p => fx(p.x).toFixed(1) + "," + sr.fy(p.y + sr.band).toFixed(1));
        const dn = sr.points.slice().reverse().map(p => fx(p.x).toFixed(1) + "," + sr.fy(p.y - sr.band).toFixed(1));
        s += `<polygon points="${up.concat(dn).join(" ")}" fill="${sr.color}" opacity="0.13"/>`;
      }
      if (sr.points.length > 1) s += `<polyline points="${pts}" fill="none" stroke="${sr.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
      sr.points.forEach(p => {
        const cx = fx(p.x).toFixed(1), cy = sr.fy(p.y).toFixed(1);
        // visible dot + a larger transparent hit-target carrying the native tooltip (date + value + unit)
        s += `<circle cx="${cx}" cy="${cy}" r="4" fill="${sr.color}"/>`;
        s += `<circle cx="${cx}" cy="${cy}" r="11" fill="transparent"><title>${esc(sr.label)}: ${p.y}${esc(u)} · ${dfmt(p.x)}</title></circle>`;
      });
      const lastP = sr.points[sr.points.length - 1];
      s += `<text x="${(fx(lastP.x) + 6).toFixed(1)}" y="${(sr.fy(lastP.y) - 8).toFixed(1)}" font-size="11" font-weight="700" fill="${sr.color}">${lastP.y}${esc(u)}</text>`;
      if (opts.dual) {
        const ax = si === 0 ? pl - 6 : W - pr + 6, anchor = si === 0 ? "end" : "start";
        s += `<text x="${ax}" y="${pt_ + 6}" font-size="10" fill="${sr.color}" text-anchor="${anchor}">${sr.hi.toFixed(0)}</text>
              <text x="${ax}" y="${H - pb}" font-size="10" fill="${sr.color}" text-anchor="${anchor}">${sr.lo.toFixed(0)}</text>`;
      }
      s += `<text x="${pl + si * 120}" y="${pt_ - 8}" font-size="11" font-weight="600" fill="${sr.color}">${esc(sr.label)}</text>`;
    });
    s += `</svg>`;
    // M47/M41: an accessible data-table alternative, so the numbers aren't trapped inside the SVG
    const rows = series.map(sr => `<tr><th style="text-align:left">${esc(sr.label)}${uOf(sr) ? " (" + esc(uOf(sr)) + ")" : ""}</th><td>${sr.points.map(p => esc(String(p.y))).join(", ")}</td></tr>`).join("");
    return s + `<details class="proto"><summary>View data as a table</summary><table class="mini"><tr><th>Series</th><th>Values (oldest → newest)</th></tr>${rows}</table></details>`;
  },
  recompStatus(first, last, n, spanDays) {
    if (!first || !last || first === last) return null;
    if (first.weightKg == null || last.weightKg == null || first.waistCm == null || last.waistCm == null) return null;
    const dw = last.weightKg - first.weightKg, dc = last.waistCm - first.waistCm;
    if ((n || 0) < 4 || (spanDays || 0) < 28)   // M22: too little data/time to infer a composition change
      return { label: "BUILDING DATA", cls: "teal", msg: "A body-composition read needs about 4 readings over a month — keep logging.", dw, dc };
    let label, cls, msg;   // probabilistic language — this is an inference, not a measurement
    if (dw >= 0.5 && dc <= -0.5) { label = "LIKELY RECOMP"; cls = "green"; msg = "Weight up, waist down — likely muscle gained while the belly shrinks. This is why weight alone isn't the target."; }
    else if (dw <= -0.5 && dc <= -0.5) { label = "LIKELY CUTTING"; cls = "green"; msg = "Weight and waist both trending down."; }
    else if (dc >= 0.5) { label = "WATCH"; cls = "orange"; msg = "Waist trending up — check the top-4 noise controls first; trust 4-week trends."; }
    else { label = "STABLE"; cls = "teal"; msg = "Holding steady."; }
    return { label, cls, msg, dw, dc };
  }
};

App.setTrend = function (days) { this.trendDays = days; this.renderDash(); };
App.renderDash = function () {
  const data = this.data, el = document.getElementById("scr-dash");
  const trendDays = this.trendDays || null;   // null = all-time (default)
  const h = data.profile.heightM, ms = data.measurements;
  const last = ms[ms.length - 1] || null, first = ms[0] || null;
  const briW = last && last.waistCm ? Calc.bri(last.waistCm, h) : null;
  const briN = last && last.navelCm ? Calc.bri(last.navelCm, h) : null;
  const briStart = first && first.waistCm ? Calc.bri(first.waistCm, h) : null;
  const now = this.now();
  let html = this.bodyToday(now) + this.bodySummaryCard(now);

  /* health excellence index — ring hero + transparent component rings */
  const ex = Score.excellence(data, now);
  const comp = this.isPersonal() ? ex.comp : ex.comp.filter(c => c.k !== "Strength");
  const parts = comp.map(c => c.k.toLowerCase()).join(" · ");
  html += `<div class="card hero"><h2>Health Excellence Index</h2>`;
  if (ex.headline == null && ex.minor) {
    html += `<div class="ringhero"><div class="ring" style="--p:0"><div class="inner"><span class="n">—</span></div></div>
        <div class="side"><div class="lab">Under 18</div><div class="st">Score hidden</div><div class="dl" style="color:var(--on-brand-mute)">Adult ranges don't apply</div></div></div></div>
      <div class="card"><div class="note">Msela's health score and reference ranges are designed for adults (18+). For under-18s, please follow age-appropriate guidance from a paediatric professional — you can still log and see your raw numbers.</div></div>`;
  } else if (ex.headline == null) {
    const nm = ((data.profile && data.profile.name) || "").trim();
    const building = ex.present >= 1;   // M07: 1 area of data = "building", not a headline number
    const lab = building ? "Building your score" : ("Welcome" + (nm ? ", " + esc(nm) : ""));
    const st = building ? (ex.present + " of 2 areas ready") : "Let's begin";
    const dl = building ? "Add one more area to complete your score" : "Two taps to light up your score";
    html += `<div class="ringhero">
        <div class="ring" style="--p:0"><div class="inner"><span class="n">—</span><span class="of">/ 100</span></div></div>
        <div class="side"><div class="lab">${lab}</div><div class="st">${st}</div><div class="dl" style="color:var(--on-brand-mute)">${dl}</div></div>
      </div></div>
      <div class="card"><h2>${building ? "Almost there" : "Get started"}</h2><div class="note">Your score needs at least two areas of real data — your weekly measurements and your logged training — so a single reading can't skew it.</div>
      <div class="grid2" style="margin-top:12px"><button class="btn" onclick="App.switchTab('measure')">Add a measurement</button><button class="btn ghost" onclick="App.switchTab('today')">Open today's session</button></div></div>`;
  } else {
    const bandCol = ex.headline >= 75 ? "green" : ex.headline >= 50 ? "orange" : "red";
    const label = ex.headline >= 75 ? "Green" : ex.headline >= 50 ? "Amber" : "Red";
    html += `<div class="ringhero">
        <div class="ring" style="--p:${ex.headline}"><div class="inner"><span class="n">${ex.headline}</span><span class="of">/ 100</span></div></div>
        <div class="side"><div class="lab">Overall</div><div class="st"><span class="chip ${bandCol}">${label}</span></div><div class="dl" style="color:var(--on-brand-mute)">${esc(parts)}</div></div>
      </div></div>
      <div class="card"><h2>The signal</h2><div class="note">Transparent by design — these rings are the real picture; the headline just flags where to look.</div>
      <div class="gridR">` + comp.map(c => Dash.ring(c.v != null ? c.v / 100 : null, c.v != null ? "" : "no data", c.k, "")).join("") + `</div></div>`;
  }

  /* gauge */  /* gauge */
  html += `<div class="card"><h2>Body Roundness Index</h2>${Dash.gauge(briW, briN, data.targets.bri)}`;
  if (briW != null) {
    const z = Calc.briZone(briW);
    html += `<div style="text-align:center;margin-top:2px"><span class="chip ${z.cls}">${esc(z.label)}</span>`;
    html += `<div class="t-support" style="margin-top:7px;color:var(--navy)">Target ${data.targets.bri.toFixed(2)} · waist ≈${data.targets.waistCm} cm</div>`;
    if (briN != null) html += `<div class="t-support" style="margin-top:4px;color:var(--slate2)">Navel ${briN.toFixed(2)} · personal reference</div>`;
    html += `<div class="t-support" style="margin-top:4px;font-size:11px;color:var(--slate2)">${esc(BRI_MODEL.source)}</div></div>`;
  }
  html += `</div>`;

  /* rings */
  if (first && last) {
    const rs = [
      { pct: Dash.progressPct(first.waistCm, data.targets.waistCm, last.waistCm), big: (last.waistCm ?? "—") + " cm", label: "Waist", sub: first.waistCm + " → " + data.targets.waistCm },
      { pct: Dash.progressPct(first.navelCm, data.targets.navelCm, last.navelCm), big: (last.navelCm ?? "—") + " cm", label: "Navel", sub: first.navelCm + " → " + data.targets.navelCm },
      { pct: briStart != null && briW != null ? Dash.progressPct(briStart, data.targets.bri, briW) : 0, big: briW != null ? briW.toFixed(2) : "—", label: "BRI", sub: (briStart != null ? briStart.toFixed(2) : "—") + " → " + data.targets.bri.toFixed(2) }
    ];
    html += `<div class="card"><h2>Progress to targets</h2><div class="grid3">` +
      rs.map(r => Dash.ring(r.pct, r.big, r.label, r.sub)).join("") + `</div></div>`;
  }

  /* trends + recomp */
  const wPts = ms.filter(m => m.weightKg != null).map(m => ({ x: Clock.parseISO(m.date).getTime(), y: m.weightKg }));
  const cPts = ms.filter(m => m.waistCm != null).map(m => ({ x: Clock.parseISO(m.date).getTime(), y: m.waistCm }));
  if (wPts.length || cPts.length) {
    html += `<div class="card"><h2>Weight vs waist — the recomp view</h2>`;
    const periods = [[30, "30d"], [90, "90d"], [null, "All"]];
    html += `<div class="segbar" role="group" aria-label="Chart period">` + periods.map(([d, lbl]) =>
      `<button type="button" class="seg${(trendDays || null) === d ? " on" : ""}" onclick="App.setTrend(${d})">${lbl}</button>`).join("") + `</div>`;
    html += Dash.chart([
      { label: "Weight", unit: "kg", color: "var(--teal)", points: wPts },
      { label: "Waist", unit: "cm", color: "var(--orange)", points: cPts, band: 0.75 }
    ], { dual: true, days: trendDays, label: "Weight versus waist over time" });
    const spanDays = (Clock.parseISO(last.date) - Clock.parseISO(first.date)) / 86400000;
    const rc = Dash.recompStatus(first, last, ms.length, spanDays);
    if (rc) html += `<div style="margin-top:8px"><span class="chip ${rc.cls}">${esc(rc.label)}</span>
      <span class="note">${rc.dw >= 0 ? "+" : ""}${rc.dw.toFixed(1)} kg, ${rc.dc >= 0 ? "+" : ""}${rc.dc.toFixed(1)} cm waist since start. ${esc(rc.msg)}</span></div>`;
    html += `<div class="note" style="margin-top:6px">Shaded band = ±0.75cm measurement noise — react to trends, not single readings.</div></div>`;
  }

  /* strength curves — only relevant to the structured training program (owner) */
  if (this.isPersonal()) {
    const tpSeries = [];
    const tpColors = ["var(--teal)", "var(--orange)", "var(--green)", "var(--input)"];
    Object.entries(data.program.tentpoles).forEach(([key, tp], i) => {
      const hist = Logic.tentpoleHistory(data, key);
      if (hist.length) tpSeries.push({ label: tp.label.split("/")[0].trim(), color: tpColors[i % 4], points: hist.map(p => ({ x: Clock.parseISO(p.date).getTime(), y: Math.round(Calc.e1rm ? p.e1rm * 10 : 0) / 10 })) });
    });
    html += `<div class="card"><h2>Tentpole strength — e1RM</h2>`;
    html += tpSeries.length ? Dash.chart(tpSeries, { label: "Estimated one-rep max per tentpole lift" })
                            : `<div class="note" style="text-align:center;padding:18px 8px">Log gym sessions and the four tentpole curves appear here.</div>`;
    html += `</div>`;
  }

  /* derived metrics */
  if (last) {
    const rows = [];
    if (last.waistCm && last.hipCm) { const v = Calc.whr(last.waistCm, last.hipCm); rows.push(["Waist-to-Hip", v.toFixed(3), Score.whrBand(v, data.profile.sex)]); }
    if (last.waistCm) { const v = Calc.whtr(last.waistCm, h); rows.push(["Waist-to-Height", v.toFixed(3), v < 0.45 ? ["LEAN", "green"] : v < 0.50 ? ["GOOD", "green"] : v < 0.55 ? ["IMPROVING", "orange"] : ["FOCUS", "red"]]); }
    if (last.navelCm && last.waistCm) { const v = last.navelCm - last.waistCm; rows.push(["Navel−waist gap", v.toFixed(1) + " cm", v < 3 ? ["TIGHT", "green"] : v < 6 ? ["GOOD", "green"] : v < 10 ? ["PROGRESSING", "orange"] : ["FOCUS", "red"]]); }
    if (last.rhr) rows.push(["Resting HR", last.rhr + " bpm", last.rhr < 50 ? ["EXCELLENT", "green"] : last.rhr < 60 ? ["ATHLETIC", "green"] : last.rhr < 70 ? ["GOOD", "teal"] : ["TRACK", "orange"]]);
    if (last.bpSys && last.bpDia) { const bf = Score.bpFlag(last.bpSys, last.bpDia); rows.push(["Blood pressure", last.bpSys + "/" + last.bpDia, [bf.cls === "red" ? "REVIEW" : bf.cls === "orange" ? "ELEVATED" : "IN RANGE", bf.cls]]); }
    if (last.bodyFatPct != null) { const v = last.bodyFatPct; rows.push(["Body fat % (DEXA)", v.toFixed(1) + "%", Score.bodyFatBand(v, data.profile.sex)]); }
    if (last.weightKg) rows.push(["BMI (limited use)", Calc.bmi(last.weightKg, h).toFixed(1), ["REFERENCE", "teal"]]);
    if (rows.length) {
      html += `<div class="card"><h2>Derived metrics — ${esc(last.date)}</h2><table class="mini"><tr><th>Metric</th><th>Value</th><th>Status</th></tr>`;
      rows.forEach(([m, v, [lab, cls]]) => { html += `<tr><td>${esc(m)}</td><td><b>${esc(v)}</b></td><td><span class="chip ${cls}">${esc(lab)}</span></td></tr>`; });
      html += `</table>`;
      const notes = [];
      if (last.rhr) { const rf = Score.rhrFlag(last.rhr); if (rf) notes.push("Resting HR — " + rf); }
      if (last.bpSys && last.bpDia) { const bf = Score.bpFlag(last.bpSys, last.bpDia); if (bf.cls !== "green") notes.push("Blood pressure — " + bf.label); }
      notes.forEach(n => { html += `<div class="msg warn" style="margin-top:8px">${esc(n)}</div>`; });
      const needSex = !data.profile.sex && ((last.waistCm && last.hipCm) || last.bodyFatPct != null);
      html += `<div class="note" style="margin-top:6px;font-size:11.5px">Blood pressure is shown for awareness only — it is not part of your score, and none of this is a diagnosis.${needSex ? " Add your sex in Data → Profile to grade waist-to-hip and body-fat correctly (their healthy ranges differ by sex)." : ""}</div></div>`;
    }
  }
  if (!ms.length) html += `<div class="card"><div class="note" style="text-align:center;padding:20px">Add your first measurement to light up the dashboard.</div></div>`;
  el.innerHTML = html;
};

/* ============ DATA I/O — export, import, calendar (Phase 4) ============ */
const DataIO = {
  download(name, text, mime) {
    const blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 150);
  },
  stamp() { return Clock.toISO(App.now()); },
  backupText() {
    const meta = { app: "Msela", schema: App.data.schema || 1, exportedAt: new Date().toISOString() };
    return JSON.stringify(Object.assign({ _meta: meta }, App.data), null, 2);
  },
  markBackedUp() {
    App.data.lastBackup = new Date().toLocaleString("en-GB");
    App.data.lastBackupISO = new Date().toISOString();
    Store.save(App.data);
  },
  exportJSON() {
    this.download("msela-backup-" + this.stamp() + ".json", this.backupText(), "application/json");
    this.markBackedUp(); App.renderData(); toast("Backup exported");
  },
  async copyBackup() {
    const txt = this.backupText();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(txt);
      else throw new Error("no-clipboard");
      this.markBackedUp(); App.renderData(); toast("Backup copied — paste it somewhere safe (Notes, email to yourself)");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.focus(); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
      ta.remove();
      if (ok) { this.markBackedUp(); App.renderData(); toast("Backup copied"); }
      else toast("Couldn't copy here — use Export backup instead");
    }
  },
  pasteRestore() {
    const str = window.prompt("Paste your Msela backup text here (the JSON you copied or exported):");
    if (str == null || !str.trim()) return;
    this.importText(str.trim());
  },
  csvRow(arr) { return arr.map(v => { v = (v == null ? "" : String(v)); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); },
  exportMeasurementsCSV() {
    const h = App.data.profile.heightM;
    const head = ["date","weightKg","waistCm","navelCm","hipCm","bodyFatPct","sleepH","sleepScore","rhr","bpSys","bpDia","BRI_waist","BRI_navel","WHtR","WHR","BMI","notes"];
    const rows = App.data.measurements.map(m => this.csvRow([

  icsEsc(s) { return String(s).replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n"); },

  buildICS(data, opts) {

    const start = Clock.parseISO(data.program.startDate);
    // Dynamic window (M44): default to the current week forward, so the file always

    const gym = [

      if (!deload) gym.forEach(([key, off, hr, dur, lbl]) => {
        const sess = data.program.sessions[key];
        const exs = sess.slots.map(sl => sl.w[(wk - 1) % sl.w.length]).filter(x => x && x !== "—");
        const s0 = dayAt(wk, off, hr, 0);
        push(s0, new Date(s0.getTime() + dur * 60000), "W" + wk + " " + lbl,
          (blk ? blk.name + " block • " + blk.params + "\n" : "") + "Exercises: " + exs.join(", "), 30);
      });
      else { const s0 = dayAt(wk, 0, 18, 0); push(s0, new Date(s0.getTime() + 45 * 60000), "W" + wk + " DELOAD — light lifting + walks + basketball", wk === 6 ? "Book chiropractor + physio assessment." : "Book DEXA follow-up + BP recheck.", 0); }
      [2, 4].forEach(off => { const s0 = dayAt(wk, off, 18, 0); push(s0, dayAt(wk, off, 21, 0), "W" + wk + " Basketball", "Snack 5pm • post-game meal within 90 min.", 60); });
      let desc = "Within 30 min waking • post-bathroom • pre-food/water • naked, hard floor • tape parallel, end of exhale • measure 3×, record median.";
      if (wk === 1) desc += "\nBOOK: DEXA baseline + blood panel + BP.";
      else if (wk % 26 === 0) desc += "\nBOOK: DEXA + blood panel + BP check (every 26 weeks).";
      else if (wk % 12 === 0) desc += "\nBOOK: BP recheck + progress review.";
      // Monday morning (offset 0): measurement on waking, before food/water or training.
      push(dayAt(wk, 0, 6, 30), dayAt(wk, 0, 7, 0), "W" + wk + " Monday measurement", desc, 30);

/* ============ FILE-FIRST SYNC (File System Access API) ============ */
const FileSync = {
  handle: null, _writing: false, _pending: null,
  supported() { return typeof window !== "undefined" && "showSaveFilePicker" in window; },
  async link() {
    try {
      this.handle = await window.showSaveFilePicker({ suggestedName: "msela-data.json",
        types: [{ description: "Msela data", accept: { "application/json": [".json"] } }] });
      await this.write(App.data); App.fileName = this.handle.name;
      toast("Linked — auto-saving to " + this.handle.name); App.renderData();
    } catch (e) { if (e.name !== "AbortError") toast("Could not link file"); }
  },
  async open() {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: "Msela data", accept: { "application/json": [".json"] } }] });
      const obj = JSON.parse(await (await h.getFile()).text());
      if (!obj || !Array.isArray(obj.measurements) || !obj.program) return toast("Not a Msela data file");
      if (!confirm("Load this file and auto-save to it from now on? Current on-device data will be replaced.")) return;
      this.handle = h; App.data = mergeSaved(obj);
      App.data.targets.bri = +Calc.bri(App.data.targets.waistCm, App.data.profile.heightM).toFixed(2);
      App.fileName = h.name; Store.save(App.data); App.renderAll(); App.switchTab("data"); toast("Opened " + h.name);
    } catch (e) { if (e.name !== "AbortError") toast("Could not open file"); }
  },
  // M34: serialise writes and coalesce to the latest state, so rapid edits can't race or interleave.
  async write(data) {
    this._pending = data;
    if (this._writing) return;            // an in-flight write will pick up the latest _pending
    this._writing = true;
    try {
      while (this._pending && this.handle) {
        const d = this._pending; this._pending = null;
        try { const w = await this.handle.createWritable(); await w.write(JSON.stringify(d, null, 2)); await w.close(); }
        catch (e) { toast("File write failed — data is still saved on this device"); break; }
      }
    } finally { this._writing = false; }
  }
};

// Phase 4: the day's planned confirmations, as a clean chip row. Only today's 1–2 items ever show.
App.dayPlan = function (now, day) {
  const data = this.data, today = Clock.toISO(now), d = now.getDay();
  const has = t => (data.activities || []).some(a => a.date === today && a.type === t);
  const plan = [];
  // Measurement is a MONDAY-MORNING job (on waking, pre-food/water) — the start of the training week.
  if (d === 1) plan.push({ t: "measure", l: "Measure", e: "📏", done: data.measurements.some(m => m.date === today), link: "measure" });
  if (day.kind === "gym") {
    plan.push({ t: "strength", l: "Strength", e: "🏋️", done: data.workouts.some(w => w.date === today), link: "log", sess: day.sessionKey });
    plan.push({ t: "walk", l: "Walk", e: "🚶", done: has("walk"), toggle: true });   // gym days pair with the day's walk
  } else if (day.activity === "basketball") {
    // Wed/Fri catch-up days: basketball is the planned activity
    plan.push({ t: "basketball", l: "Basketball", e: "🏀", done: has("basketball"), toggle: true });
  } else {
    plan.push({ t: "recovery", l: "Recovery walk", e: "🚶", done: has("recovery"), toggle: true });
  }
  // Pilates — optional cross-training, loggable any day; doesn't count toward the daily total.
  plan.push({ t: "pilates", l: "Pilates", e: "🧘", done: has("pilates"), toggle: true, optional: true });
  return plan;
};

App.checkpointsCard = function () {

  const rows = cps.map((c, i) => {
    const m = meta[c.status] || meta.todo;
    const dateBit = c.date ? " · " + esc(c.date) : "";

App.renderProgress = function () {
  const data = this.data, el = document.getElementById("scr-progress"); if (!el) return;
  const ms = data.measurements, h = data.profile.heightM, now = this.now();
  // v19: three lenses — Body (is my body changing?), Consistency (am I doing what I said?), Health (broader signals).
  const tabs = [["body","Body"],["consistency","Consistency"],["health","Health"]];
  let lens = this.insightLens || "body";
  if (!tabs.some(([k]) => k === lens)) lens = "body";
  const menu = `<div class="seg lens" role="tablist" aria-label="Choose an analysis">` +
    tabs.map(([k,lab]) => `<button role="tab" aria-pressed="${lens === k}" onclick="App.setLens('${k}')">${lab}</button>`).join("") + `</div>`;
  const fmt = (v, dp) => v == null ? "—" : v.toFixed(dp);
  let bodyHtml;
  if (lens === "consistency") bodyHtml = this.lensConsistency(data, now);
  else if (lens === "health") bodyHtml = this.lensHealth(data, now, fmt);
