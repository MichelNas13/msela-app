App.lensConsistency = function (data, now) {
  const wins = [7, 30, 90];
  const bands = wins.map(w => Score.bodyBreakdown(data, now, w));
  const chip = v => { const col = v == null ? 'teal' : v >= 75 ? 'green' : v >= 50 ? 'orange' : 'red'; return '<td style="text-align:center"><span class="chip ' + col + '">' + (v == null ? '—' : v) + '</span></td>'; };
  const row = (lbl, key) => '<tr><td>' + lbl + '</td>' + bands.map(b => chip(b[key])).join('') + '</tr>';
  let html = '<div class="card"><h2>Consistency</h2><div class="note">Am I doing what I said I would? Behavioural adherence over 7 / 30 / 90 days — green ≥75 · amber 50–74 · red &lt;50.</div>'
    + '<table class="mini"><tr><th>Behaviour</th><th>7d</th><th>30d</th><th>90d</th></tr>'
    + row('Movement', 'movement') + row('Steps', 'activity') + row('Nutrition', 'nutrition') + row('Hydration', 'hydration') + row('Sleep', 'recovery')
    + '<tr><td><b>Body overall</b></td>' + bands.map(b => '<td style="text-align:center"><b>' + (b.body == null ? '—' : b.body) + '</b></td>').join('') + '</tr>'
    + '</table></div>';
  return html;
};
App.lensHealth = function (data, now, fmt) {
  const ms = data.measurements, last = ms[ms.length - 1] || null;
  const ex = Score.excellence(data, now);
  const hv = ex.headline;
  const band = hv == null ? { col: 'teal', lab: 'Not enough data' } : hv >= 75 ? { col: 'green', lab: 'Green' } : hv >= 50 ? { col: 'orange', lab: 'Amber' } : { col: 'red', lab: 'Red' };
  let html = '<div class="card"><h2>Health Excellence Index</h2><div style="text-align:center;margin:10px 0 4px"><span class="chip ' + band.col + '" style="font-size:26px;padding:8px 18px">' + (hv == null ? '—' : hv) + '</span></div><div class="note" style="text-align:center">&lt;50 red · 50–74 amber · ≥75 green. A weighted blend of your health signals — a guide to where to look, not a diagnosis.</div></div>';
  const sig = [];
  if (last) {
    if (last.rhr != null) sig.push(['Resting HR', last.rhr + ' bpm', Score.rhr(last.rhr), Score.rhrFlag(last.rhr)]);
    if (last.bpSys && last.bpDia) { const bf = Score.bpFlag(last.bpSys, last.bpDia); sig.push(['Blood pressure', last.bpSys + '/' + last.bpDia, bf.cls === 'green' ? 90 : bf.cls === 'orange' ? 60 : 30, bf.cls === 'green' ? '' : bf.label]); }
    if (last.bodyFatPct != null) sig.push(['Body fat % (DEXA)', fmt(last.bodyFatPct, 1) + '%', null, '']);
  }
  if (sig.length) {
    html += '<div class="card"><h2>Health signals</h2><div class="note">From your latest measurement. Record these under Measure.</div><table class="mini"><tr><th>Signal</th><th>Latest</th><th>Read</th></tr>'
      + sig.map(s => { const col = s[2] == null ? 'teal' : s[2] >= 75 ? 'green' : s[2] >= 50 ? 'orange' : 'red'; return '<tr><td>' + s[0] + '</td><td>' + esc(s[1]) + '</td><td><span class="chip ' + col + '">' + (s[2] == null ? 'ref' : s[2]) + '</span></td></tr>' + (s[3] ? '<tr><td colspan="3"><div class="note" style="font-size:11px;margin:0">' + esc(s[3]) + '</div></td></tr>' : ''); }).join('')
      + '</table></div>';
  } else {
    html += '<div class="card"><div class="note">Record resting HR, blood pressure or DEXA body-fat under Measure to see your health signals here.</div></div>';
  }
  return html;
};
App.lensBody = function (ms, h, now, fmt) {
  if (ms.length < 2)
    return `<div class="card"><div class="note" style="text-align:center;padding:20px">Add at least two measurements and your body trends light up here — graded green / amber / red.</div></div>`;
  const T = this.data.targets, mon = d => d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
  const projDefs = [["Weight","weightKg","kg",1,T.weightKg],["Waist","waistCm","cm",1,T.waistCm],["Navel","navelCm","cm",1,T.navelCm],["BRI","bri","",2,T.bri]];
  let prows = "";
  for (const [label,f,unit,dp,tgt] of projDefs) {
    const p = Insights.projection(ms, f, h, tgt, now); if (!p) continue;
    let chip, txt, pace = "—";
    if (p.insufficient) { chip = "teal"; txt = "need ≥4 readings over ~3 wks"; }   // M22: honest about too-little data
    else {
      pace = p.perMonth != null ? (p.perMonth > 0 ? "+" : "") + fmt(p.perMonth, dp) + (unit ? " " + unit : "") + "/mo" : "—";
      if (p.reached) { chip = "green"; txt = "target met 🎉"; }
      else if (p.stalled) { chip = "orange"; txt = "holding — " + (p.gap > 0 ? "+" : "") + fmt(p.gap, dp) + (unit ? " " + unit : "") + " to go"; }
      else { chip = "teal"; const loW = Math.max(1, Math.round(p.months * 0.7 * 4.345)), hiW = Math.max(1, Math.round(p.months * 1.5 * 4.345)); txt = "est. " + loW + "–" + hiW + " wks"; }
    }
    const nowV = p.latest ? fmt(p.latest.v, dp) + (unit ? " " + esc(unit) : "") : "—";
    prows += `<tr><td>${esc(label)}</td><td>${nowV} → ${fmt(tgt,dp)}${unit?" "+esc(unit):""}</td><td>${esc(pace)}</td><td><span class="chip ${chip}">${esc(txt)}</span></td></tr>`;
  }
  let html = prows ? `<div class="card"><h2>Projection to target</h2><div class="note">A rough estimate from your recent pace — a range, not a promise, and only once there's enough data. It assumes the trend holds.</div><table class="mini"><tr><th>Metric</th><th>Now → target</th><th>Pace</th><th>Est. runway</th></tr>${prows}</table></div>` : "";
  const y = now.getFullYear(), mo = now.getMonth(), q = Math.floor(mo / 3) * 3;
  const periods = [["All-time",new Date(1970,0,1)],["This month",new Date(y,mo,1)],["This quarter",new Date(y,q,1)],["Year to date",new Date(y,0,1)],["Last 12 months",new Date(now.getTime()-365*86400000)]];
  const RULES = { weightKg:{good:-0.2,bad:0.2}, waistCm:{good:-0.5,bad:0.3}, navelCm:{good:-0.5,bad:0.3}, bri:{good:-0.05,bad:0.03}, bodyFatPct:{good:-0.3,bad:0.2} };
  const metrics = [["Weight","weightKg","kg",1],["Waist","waistCm","cm",1],["Navel","navelCm","cm",1],["BRI","bri","",2],["Body fat","bodyFatPct","%",1]];
  const first = Clock.parseISO(ms[0].date), span = Math.round((now - first) / 86400000);
  html += `<div class="card"><h2>Trend by period</h2><div class="note">${ms.length} readings over ${span} days. Each period compares your latest reading with your value entering it — green improving / amber holding / red slipping, by change-per-month.</div></div>`;
  for (const [plabel, start] of periods) {
    let rows = "";
    for (const [label, f, unit, dp] of metrics) {
      const d = Track.delta(ms, f, h, start); if (!d) continue;
      let chip = "teal", chg, range;
      if (d.change == null) { chip = "teal"; chg = "need a baseline"; range = "from " + fmt(d.base.v, dp) + (unit ? " " + unit : ""); }
      else {
        const months = Math.max(0.25, (d.latest.d - d.base.d) / (30.44 * 86400000)), r = d.change / months, rule = RULES[f];
        const rating = r <= rule.good ? "good" : (r >= rule.bad ? "bad" : "meh");
        chip = rating === "good" ? "green" : rating === "bad" ? "red" : "orange";
        chg = (d.change > 0 ? "+" : "") + fmt(d.change, dp) + (unit ? " " + unit : "");
        range = fmt(d.base.v, dp) + " → " + fmt(d.latest.v, dp) + (unit ? " " + unit : "");
      }
      rows += `<tr><td>${esc(label)}</td><td>${esc(range)}</td><td><span class="chip ${chip}">${esc(chg)}</span></td></tr>`;
    }
    html += `<div class="card"><h2>${esc(plabel)}</h2><table class="mini"><tr><th>Metric</th><th>Range</th><th>Change</th></tr>${rows}</table></div>`;
  }
  return html;
};

App.lensStrength = function (data, now, fmt) {
  // Projected path — a target ladder per key lift, shown even before you've logged. Front-loaded curve
  // (strength climbs faster early): weight at week w = start + (goal-start) × (w/52)^0.7.
  const curKg = key => { for (let i = (data.workouts || []).length - 1; i >= 0; i--) { const s = (data.workouts[i].sets || []).find(x => x.tent === key && isFinite(x.kg)); if (s) return s.kg; } return null; };
  const r05 = v => Math.round(v * 2) / 2;
  let prows = "";
  for (const [key, tp] of Object.entries(data.program.tentpoles)) {
    if (tp.start == null || tp.goal == null) continue;
    const cur = curKg(key), base = tp.start, goal = tp.goal, at = w => r05(base + (goal - base) * Math.pow(w / 52, 0.7));
    const pct = cur != null ? Math.max(0, Math.min(100, Math.round((cur - base) / (goal - base) * 100))) : 0;
    const chip = cur == null ? "teal" : pct >= 100 ? "green" : pct >= 50 ? "teal" : "orange";
    prows += `<tr><td><b>${esc(tp.label)}</b><br><span style="color:var(--slate);font-size:11px">${esc(tp.unit || "kg")}</span></td><td>${cur != null ? cur : base}</td><td>${at(12)}</td><td>${at(26)}</td><td><b>${goal}</b></td><td><span class="chip ${chip}">${cur != null ? pct + "%" : "start"}</span></td></tr>`;
  }
  const projCard = prows ? `<div class="card"><h2>Projected path to your goals</h2><div class="note">A guide, not a promise — where steady, earned progress could put you (front-loaded, since strength climbs faster early). Your live Log cues are what actually move you there.</div><div class="scrollx"><table class="mini nowrap"><tr><th>Lift</th><th>Now</th><th>~12wk</th><th>~26wk</th><th>Goal</th><th>To goal</th></tr>${prows}</table></div></div>` : "";
  if (!data.workouts.length)
    return projCard + `<div class="card"><div class="note" style="text-align:center;padding:20px">Log a few gym sessions and your live e1RM trends, stalls and tonnage appear here.</div></div>`;
  let trows = "";
  for (const [key, tp] of Object.entries(data.program.tentpoles)) {
    const hist = Logic.tentpoleHistory(data, key), st = Logic.stallStatus(hist);
    const traj = hist.length ? hist[0].e1rm.toFixed(0) + " → " + hist[hist.length - 1].e1rm.toFixed(0) + " kg" : "—";
    const chg = hist.length > 1 ? (hist[hist.length - 1].e1rm - hist[0].e1rm) : null;
    const chgTxt = chg == null ? "" : " (" + (chg >= 0 ? "+" : "") + chg.toFixed(0) + ")";
    trows += `<tr><td><b>${esc(tp.label)}</b><br><span style="color:var(--slate);font-size:11.5px">target ${esc(String(tp.targetW16))}</span></td><td>${esc(traj)}${esc(chgTxt)}</td><td><span class="chip ${st.cls}">${esc(st.label)}</span></td></tr>`;
  }
  const t28 = Insights.tonnage(data.workouts, new Date(now.getTime() - 28 * 86400000));
  const tPrev = Insights.tonnage(data.workouts.filter(w => { const d = Clock.parseISO(w.date); return d < new Date(now.getTime() - 28 * 86400000) && d >= new Date(now.getTime() - 56 * 86400000); }), null);
  const dv = tPrev.kg ? Math.round((t28.kg - tPrev.kg) / tPrev.kg * 100) : null;
  const volChip = dv == null ? "teal" : dv >= 0 ? "green" : "orange";
  const volTxt = dv == null ? "first block" : (dv >= 0 ? "+" : "") + dv + "% vs prior 28d";
  const ton = `<div class="card"><h2>Training volume</h2><div class="note">Total weight moved (sets × reps × kg), summed across all lifts. Read it as a <b>trend</b>, not an absolute — it adds up different movements, so watch the direction. Your session count, hard sets and per-lift progression are the more reliable signals.</div><table class="mini">
    <tr><th>Window</th><th>Volume</th><th>Sets</th><th></th></tr>
    <tr><td>Last 28 days</td><td><b>${t28.kg.toLocaleString()} kg</b></td><td>${t28.sets}</td><td><span class="chip ${volChip}">${esc(volTxt)}</span></td></tr>
    <tr><td>Prior 28 days</td><td>${tPrev.kg.toLocaleString()} kg</td><td>${tPrev.sets}</td><td></td></tr></table></div>`;
  return projCard + `<div class="card"><h2>Key lifts (e1RM)</h2><div class="note">Estimated 1-rep max from your best logged set — rising means real strength gain. "Stalled" = no progress in 3 sessions; check recovery, sleep, food.</div><table class="mini"><tr><th>Lift</th><th>e1RM trail</th><th>Status</th></tr>${trows}</table></div>` + ton;
};

App.lensTraining = function (data, now) {
  const days = this.coreDays(), names = { pushA:"Tue · Chest+Tri", pushB:"Thu · Delts+Bi", pullB:"Sat · Back+Legs" };
  const end = this.blockEnd();
  let crows = "";
  days.forEach(k => {
    const cl = this.clusterOf(k), pct = Math.round(cl / end * 100), chip = cl >= end ? "green" : pct >= 50 ? "teal" : "orange";
    crows += `<tr><td>${esc(names[k] || k)}</td><td>cluster <b>${cl}</b> / ${end}</td><td><span class="chip ${chip}">${this.isBlocked(k) ? "block done ✓" : pct + "%"}</span></td></tr>`;
  });
  const s7 = Insights.sessionsInWindow(data.workouts, now, 7), s28 = Insights.sessionsInWindow(data.workouts, now, 28);
  const consChip = s7 >= 4 ? "green" : s7 >= 3 ? "orange" : "red";
  const allTon = Insights.tonnage(data.workouts, null);
  const cons = `<div class="card"><h2>Consistency</h2><table class="mini">
    <tr><td>Gym sessions this week</td><td><b>${s7}</b> / 4 core</td><td><span class="chip ${consChip}">${s7 >= 4 ? "on track" : "keep going"}</span></td></tr>
    <tr><td>Sessions last 28 days</td><td><b>${s28}</b></td><td><span class="chip teal">≈ ${(s28/4).toFixed(1)}/wk</span></td></tr>
    <tr><td>Total sessions logged</td><td><b>${data.workouts.length}</b></td><td></td></tr>
    <tr><td>Total volume (all lifts)</td><td><b>${allTon.kg.toLocaleString()} kg</b></td><td></td></tr></table></div>`;
  return `<div class="card"><h2>Where each day stands</h2><div class="note">Your four strength days progress independently. Each climbs to ${end} clusters this block, then holds for an earned deload. Wed/Fri catch-up days aren't gated.</div><table class="mini"><tr><th>Day</th><th>Cluster</th><th>Block</th></tr>${crows}</table></div>` + cons;
};

App.lensActivity = function (data, now) {
  const N = 8;
  const block = (type, label, emoji) => {
    const wk = Insights.weeklyCount(data.activities, type, now, N), streak = Insights.streak(data.activities, type, now);
    const total = wk.reduce((a, c) => a + c.n, 0), avg = (total / N).toFixed(1);
    let cells = wk.map(w => `<td style="text-align:center">${w.n > 0 ? `<span class="chip green" style="margin:0">${w.n}</span>` : `<span style="color:var(--slate2)">0</span>`}</td>`).join("");
    return `<div class="card"><h2>${emoji} ${esc(label)}</h2><div class="note">Sessions per week, last ${N} weeks. Current streak: <b>${streak}</b> week${streak === 1 ? "" : "s"} • avg ${avg}/wk.</div>
      <div class="scrollx"><table class="mini nowrap"><tr>${wk.map(w => `<th style="text-align:center">${esc(w.week.split("-W")[1])}</th>`).join("")}</tr><tr>${cells}</tr></table></div></div>`;
  };
  let out = "";
  if (this.isPersonal()) {
    // Plan adherence (confirmed ÷ planned so far this week) + weekly steps trend + the owner's real activity types
    const act = Score.activity(data, now);
    out += `<div class="card"><h2>This week's plan</h2>
      <div style="text-align:center"><span class="bigscore">${act == null ? "—" : act + "%"}</span> <span class="note">confirmed vs planned so far</span></div>
      <div class="note" style="margin-top:6px">Counts only what's due up to today, so a fresh week isn't penalised. Confirm items on the Today tab.</div></div>`;
    const wks = [];
    for (let i = N - 1; i >= 0; i--) { const d = new Date(now.getTime() - i * 7 * 86400000), k = Clock.isoWeekKey(d); wks.push({ k, v: (data.stepsLog && data.stepsLog[k]) || 0 }); }
    if (wks.some(w => w.v > 0)) {
      out += `<div class="card"><h2>🚶 Weekly steps</h2><div class="scrollx"><table class="mini nowrap"><tr>${wks.map(w => `<th style="text-align:center">${esc(w.k.split("-W")[1])}</th>`).join("")}</tr>
        <tr>${wks.map(w => `<td style="text-align:center">${w.v ? Math.round(w.v / 1000) + "k" : "—"}</td>`).join("")}</tr></table></div><div class="note">Total steps per week, Mon–Sun (enter on Sunday).</div></div>`;
    }
    out += block("walk", "Walk", "🚶") + block("basketball", "Basketball", "🏀") + block("pilates", "Pilates", "🧘") + block("recovery", "Recovery walk", "🥾");
  } else {
    out += block("workout", "Workout", "🏋️") + block("movement", "Movement", "🚶") + block("sports", "Sports / workout", "🤾") + block("other", "Other workout", "🧘");
  }
  return out + `<div class="card"><div class="note">Your sessions by week, from what you confirm on Today.</div></div>`;
};

App.lensScores = function (data, now, fmt) {
  const ex = Score.excellence(data, now);
  const head = ex.headline == null ? "—" : ex.headline;
  const headChip = ex.headline == null ? "teal" : ex.headline >= 80 ? "green" : ex.headline >= 50 ? "orange" : "red";
  // The Strength component is part of the structured program; hide it for the general (non-owner) experience.
  const comp = this.isPersonal() ? ex.comp : ex.comp.filter(c => c.k !== "Strength");
  let crows = comp.map(c => {
    const chip = c.v == null ? "teal" : c.v >= 80 ? "green" : c.v >= 50 ? "orange" : "red";
    return `<tr><td>${esc(c.k)}</td><td style="color:var(--slate)">weight ${c.w}%</td><td><span class="chip ${chip}">${c.v == null ? "no data" : c.v}</span></td></tr>`;
  }).join("");
  const exDesc = this.isPersonal()
    ? "A weighted blend of your body, fitness markers and strength trend — a guide to where to look, not a diagnosis."
    : "A weighted blend of your body and fitness markers — a guide to where to look, not a diagnosis.";
  const exCard = `<div class="card"><h2 style="display:flex;justify-content:space-between;align-items:center;gap:8px">Health Excellence index <span class="chip ${headChip}">${head}</span></h2><div class="note">${exDesc}</div><table class="mini"><tr><th>Component</th><th></th><th>Score</th></tr>${crows}</table></div>`;
  return exCard;   // legacy "Health Excellence" lens, superseded by the Body pillar; former procCard/adhCard removed in 2.0
};
App._renderAllProg = App.renderAll;
App.renderAll = function () { this._renderAllProg(); this.renderProgress(); };

if (typeof module !== "undefined") { module.exports = { Calc, Clock, Logic, Dash, DataIO, DEFAULT_DATA }; }
</script>
